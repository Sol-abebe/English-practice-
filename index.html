<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 3D Grammar & Vocabulary Quest 🌟</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --secondary: #ec4899;
            --accent: #8b5cf6;
            --bg-gradient: linear-gradient(135deg, #f0abfc 0%, #818cf8 50%, #38bdf8 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #22c55e;
            --error: #ef4444;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 24px;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #3b0764 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.9);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 1200px;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: var(--radius);
            box-shadow: var(--shadow), 0 0 50px rgba(99, 102, 241, 0.2);
            padding: 30px;
            transform-style: preserve-3d;
            position: relative;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            padding-bottom: 15px;
        }

        .stats-badge {
            display: flex;
            gap: 15px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .badge {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-group {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: rgba(0,0,0,0.05);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: var(--text-main);
            transition: transform 0.2s, background 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            background: rgba(99, 102, 241, 0.2);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title {
            text-align: center;
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .hero-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 1.05rem;
            margin-bottom: 30px;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .mode-btn {
            flex: 1;
            max-width: 250px;
            padding: 14px 20px;
            border-radius: 16px;
            border: 2px solid rgba(99, 102, 241, 0.3);
            background: transparent;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .mode-btn span {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .mode-btn.active span {
            color: rgba(255, 255, 255, 0.8);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .category-card {
            background: var(--card-bg);
            border: 2px solid rgba(99, 102, 241, 0.15);
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .category-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 25px -8px rgba(99, 102, 241, 0.3);
        }

        .category-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .category-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .category-card .q-count {
            align-self: flex-start;
            font-size: 0.75rem;
            background: rgba(236, 72, 153, 0.1);
            color: var(--secondary);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 4px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            flex: 1;
            height: 10px;
            background: rgba(0,0,0,0.08);
            border-radius: 5px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 5px;
        }

        .timer-display {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--secondary);
            background: rgba(236, 72, 153, 0.1);
            padding: 6px 12px;
            border-radius: 12px;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        [data-theme="dark"] .question-card {
            background: rgba(15, 23, 42, 0.6);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media(max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: var(--card-bg);
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-radius: 14px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn span.opt-letter {
            width: 28px;
            height: 28px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
            transform: translateY(-2px);
        }

        .option-btn.correct {
            background: rgba(34, 197, 94, 0.15) !important;
            border-color: var(--success) !important;
            color: #15803d;
        }
        .option-btn.correct span.opt-letter {
            background: var(--success);
            color: white;
        }

        .option-btn.incorrect {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--error) !important;
            color: #b91c1c;
        }
        .option-btn.incorrect span.opt-letter {
            background: var(--error);
            color: white;
        }

        .explanation-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(99, 102, 241, 0.08);
            border-left: 5px solid var(--primary);
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .explanation-box.show {
            display: block;
        }

        .quiz-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .results-card {
            text-align: center;
            padding: 20px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            color: white;
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .score-circle h2 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
        }

        .results-summary {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: var(--text-muted);
        }

        .review-list {
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .review-item {
            background: rgba(0,0,0,0.03);
            border-radius: 12px;
            padding: 12px 16px;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
        }

        .review-item.correct { border-left-color: var(--success); }
        .review-item.incorrect { border-left-color: var(--error); }
    </style>
</head>
<body data-theme="light">
    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="stats-badge">
                <div class="badge">🔥 Streak: <span id="streakCount">0</span></div>
                <div class="badge">⭐ Best: <span id="highScore">0</span></div>
            </div>
            <div class="controls-group">
                <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound" onclick="toggleSound()">🔊</button>
                <button class="icon-btn" id="themeToggleBtn" title="Toggle Dark/Light Mode" onclick="toggleTheme()">🌙</button>
            </div>
        </div>

        <!-- Home Screen -->
        <div id="homeScreen" class="screen active">
            <h1 class="hero-title">✨ Grammar & Vocab Quest ✨</h1>
            <p class="hero-subtitle">Select a mode and topic to start your epic learning adventure!</p>
            
            <div class="mode-selector">
                <button class="mode-btn active" id="modePracticeBtn" onclick="setMode('practice')">
                    💡 Practice Mode
                    <span>Instant feedback & explanations</span>
                </button>
                <button class="mode-btn" id="modeExamBtn" onclick="setMode('exam')">
                    🏆 Exam Mode
                    <span>Timed test & final scorecard</span>
                </button>
            </div>

            <div class="category-grid" id="categoryGrid">
                <!-- Populated dynamically -->
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quizScreen" class="screen">
            <div class="quiz-header">
                <button class="icon-btn" title="Exit to Menu" onclick="quitQuiz()">🏠</button>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="timer-display" id="timerDisplay" style="display: none;">⏱️ <span id="timerVal">00:00</span></div>
            </div>

            <div class="question-card">
                <div class="question-text" id="questionText">Loading question...</div>
                <div class="options-grid" id="optionsContainer"></div>
                <div class="explanation-box" id="explanationBox">
                    <strong>💡 Explanation:</strong> <span id="explanationText"></span>
                </div>
            </div>

            <div class="quiz-footer">
                <span id="questionCounter" style="font-weight: 600; color: var(--text-muted);">Question 1 of 12</span>
                <button class="action-btn" id="nextBtn" onclick="handleNextQuestion()" disabled>Next Question ➔</button>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <div class="results-card">
                <div class="score-circle">
                    <h2 id="scorePercent">100%</h2>
                    <p id="scoreFraction">12 / 12</p>
                </div>
                <h2 id="resultTitle" style="font-size: 1.8rem; margin-bottom: 8px;">Fantastic Job! 🎉</h2>
                <p class="results-summary" id="resultMessage">You mastered this topic with flying colors!</p>

                <div class="review-list" id="reviewList"></div>

                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="action-btn" onclick="retryQuiz()">🔄 Try Again</button>
                    <button class="action-btn" onclick="goToHome()" style="background: rgba(99, 102, 241, 0.1); color: var(--primary);">🏠 Choose Topic</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- ALL 25 CATEGORIES DATABASE (FULL QUESTION COUNTS) ---
        const quizDatabase = [
            {
                id: "possessive-adj",
                title: "Possessive Adjectives",
                description: "Master words like his, her, its, their, and our.",
                questions: [
                    { q: "David always keeps _____ desk clean and organized.", options: ["a) his", "b) her", "c) their", "d) your"], correct: 0, exp: "David is male singular, so we use 'his'." },
                    { q: "The computer lost _____ connection to the Wi-Fi network.", options: ["a) his", "b) its", "c) their", "d) her"], correct: 1, exp: "For objects and animals, the possessive adjective is 'its'." },
                    { q: "I am taking _____ dog for a walk in the park.", options: ["a) your", "b) his", "c) my", "d) their"], correct: 2, exp: "The subject is 'I', so the possessive adjective is 'my'." },
                    { q: "The players celebrated _____ victory after winning the championship.", options: ["a) her", "b) his", "c) its", "d) their"], correct: 3, exp: "The subject 'The players' is plural, so we use 'their'." },
                    { q: "Sophie brushed _____ long brown hair before the party.", options: ["a) her", "b) his", "c) our", "d) their"], correct: 0, exp: "Sophie is female singular, so we use 'her'." },
                    { q: "You should check _____ email for the confirmation message.", options: ["a) my", "b) your", "c) their", "d) her"], correct: 1, exp: "The subject pronoun 'You' corresponds to 'your'." },
                    { q: "We invited all of _____ neighbors to the weekend barbeque.", options: ["a) your", "b) their", "c) our", "d) my"], correct: 2, exp: "The subject 'We' corresponds to 'our'." },
                    { q: "The store changed _____ opening hours for the holiday season.", options: ["a) his", "b) her", "c) their", "d) its"], correct: 3, exp: "The store is a single non-human entity, taking 'its'." },
                    { q: "My sister and I packed _____ suitcases for the vacation.", options: ["a) our", "b) their", "c) your", "d) her"], correct: 0, exp: "'My sister and I' equals 'we', taking 'our'." },
                    { q: "Alex forgot _____ umbrella, so he got wet in the rain.", options: ["a) her", "b) your", "c) his", "d) their"], correct: 2, exp: "Alex is male, so we use 'his'." },
                    { q: "Have you finished writing _____ essay for English class?", options: ["a) my", "b) her", "c) our", "d) your"], correct: 3, exp: "Directing the question to 'you' uses 'your'." },
                    { q: "The birds are feeding _____ chicks in the nest.", options: ["a) its", "b) his", "c) their", "d) her"], correct: 2, exp: "Plural subject 'The birds' takes 'their'." }
                ]
            },
            {
                id: "articles",
                title: "Articles (A, An, The, -)",
                description: "Practice using indefinite, definite, and zero articles.",
                questions: [
                    { q: "She wants to be _____ engineer when she finishes university.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 1, exp: "'Engineer' begins with a vowel sound (e), so we use 'an'." },
                    { q: "I saw _____ interesting documentary on television last night.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 1, exp: "'Interesting' starts with vowel 'i', taking 'an'." },
                    { q: "Paris is _____ capital city of France.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 2, exp: "Specific unique description requires the definite article 'the'." },
                    { q: "Lions are wild animals that live in _____ Africa.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 3, exp: "Continents take zero article (-)." },
                    { q: "Could you please pass me _____ salt from across the table?", options: ["a) a", "b) an", "c) the", "d) -"], correct: 2, exp: "Referring to a specific salt shaker on the table takes 'the'." },
                    { q: "My brother plays _____ guitar in a local band on weekends.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 2, exp: "Musical instruments when played take 'the'." },
                    { q: "Breakfast is usually considered _____ most important meal of the day.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 2, exp: "Superlatives like 'most important' take 'the'." },
                    { q: "He goes to _____ work by subway every single morning.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 3, exp: "Fixed expression 'to work' takes no article." },
                    { q: "She bought _____ new red jacket and a pair of boots.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 0, exp: "Singular countable noun with consonant sound takes 'a'." },
                    { q: "Mount Everest is _____ highest peak in the world.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 2, exp: "Superlative adjective 'highest' takes 'the'." },
                    { q: "We had _____ wonderful time at the beach party yesterday.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 0, exp: "'Wonderful time' takes indefinite article 'a'." },
                    { q: "She usually drinks _____ cup of coffee every morning.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 0, exp: "Singular countable noun 'cup' takes 'a'." },
                    { q: "The moon moves slowly around _____ Earth every month.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 2, exp: "Unique celestial bodies take 'the'." },
                    { q: "My uncle is _____ honest man who always tells the truth.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 1, exp: "'Honest' starts with a silent 'h', making a vowel sound 'o', so 'an'." },
                    { q: "Children often learn to swim at _____ very early age.", options: ["a) a", "b) an", "c) the", "d) -"], correct: 0, exp: "Fixed phrase 'at a very early age' uses 'a'." }
                ]
            },
            {
                id: "question-words",
                title: "Question Words",
                description: "Choose When, Where, Who, Why, How, Which, Whose.",
                questions: [
                    { q: "_____ did you buy your new red backpack? At the mall downtown?", options: ["A) When", "B) Where", "C) Who", "D) Why"], correct: 1, exp: "Answering with a location ('At the mall') requires 'Where'." },
                    { q: "_____ is your favorite season of the year, summer or winter?", options: ["A) What", "B) Which", "C) Who", "D) How"], correct: 1, exp: "Choosing between a limited set of options uses 'Which'." },
                    { q: "_____ did the children look so happy when they opened the box?", options: ["A) Where", "B) How", "C) Why", "D) When"], correct: 2, exp: "Asking for reasons uses 'Why'." },
                    { q: "_____ plays the piano in your school band during the morning assembly?", options: ["A) Who", "B) Whose", "C) What", "D) Where"], correct: 0, exp: "Asking about a person performing an action uses 'Who'." },
                    { q: "_____ does the English reading class start on Thursday mornings?", options: ["A) What time", "B) How long", "C) How often", "D) How much"], correct: 0, exp: "Asking for exact time uses 'What time'." },
                    { q: "_____ bicycle is parked outside near the school gate? Is it yours?", options: ["A) Who", "B) Which", "C) Whose", "D) What"], correct: 2, exp: "Asking about ownership requires 'Whose'." },
                    { q: "_____ do you visit your grandparents who live in the countryside? Every weekend?", options: ["A) How much", "B) How long", "C) How often", "D) How many"], correct: 2, exp: "Asking about frequency ('Every weekend') requires 'How often'." },
                    { q: "_____ did you make this delicious chocolate cake for the class party?", options: ["A) How", "B) Where", "C) When", "D) Who"], correct: 3, exp: "Asking for the person who performed the action uses 'Who'." },
                    { q: "_____ books do you have inside your school locker right now?", options: ["A) How much", "B) How many", "C) How long", "D) How often"], correct: 1, exp: "Counting plural countable nouns ('books') requires 'How many'." },
                    { q: "_____ does it take to walk from your house to the public library?", options: ["A) How far", "B) How long", "C) How many", "D) How much"], correct: 1, exp: "Asking about duration of time uses 'How long'." },
                    { q: "_____ do you usually go to school in the morning, by bus or on foot?", options: ["A) How", "B) What", "C) Where", "D) Why"], correct: 0, exp: "Asking about manner or method uses 'How'." },
                    { q: "_____ did the science teacher announce the final project deadline? Yesterday or today?", options: ["A) Where", "B) Why", "C) Who", "D) When"], correct: 3, exp: "Asking about time requires 'When'." }
                ]
            },
            {
                id: "conjunctions-preps",
                title: "Conjunctions & Prepositions",
                description: "Practice linking words and prepositions.",
                questions: [
                    { q: "She wanted to buy the dress, _____ it was too expensive.", options: ["A) and", "B) but", "C) so", "D) for"], correct: 1, exp: "Showing contrast between wanting the dress and it being expensive requires 'but'." },
                    { q: "You can have tea _____ you can have coffee; it is entirely up to you.", options: ["A) but", "B) or", "C) so", "D) for"], correct: 1, exp: "Presenting an alternative requires 'or'." },
                    { q: "He studied hard for the exam, _____ he got the highest grade in the class.", options: ["A) but", "B) or", "C) so", "D) for"], correct: 2, exp: "Showing a result from studying hard requires 'so'." },

                    { q: "My sister enjoys painting _____ making handmade cards.", options: ["A) and", "B) but", "C) because", "D) or"], correct: 0, exp: "Connecting hobbies uses 'and'." },
                    { q: "The traffic was heavy, _____ we arrived at school on time.", options: ["A) because", "B) or", "C) but", "D) so"], correct: 2, exp: "Surprising contrast despite heavy traffic uses 'but'." },
                    { q: "Turn off the lights _____ you leave the room.", options: ["A) but", "B) before", "C) because", "D) so"], correct: 1, exp: "Temporal sequence uses 'before'." },
                    { q: "I couldn't hear the teacher _____ everyone was talking.", options: ["A) because", "B) and", "C) but", "D) so"], correct: 0, exp: "Giving the reason uses 'because'." },
                    { q: "The cake looked delicious, _____ nobody wanted a second piece.", options: ["A) because", "B) so", "C) but", "D) and"], correct: 2, exp: "Unexpected contrast uses 'but'." }
                ]
            },
            {
                id: "vocabulary-practice",
                title: "Vocabulary Practice",
                description: "Everyday action words and descriptive verbs.",
                questions: [
                    { q: "The chef _____ the hot soup with a big wooden spoon before serving it.", options: ["a) kitchen", "b) red", "c) delicious", "d) stirred"], correct: 3, exp: "Action of mixing soup is 'stirred'." },
                    { q: "Tomorrow, our class will _____ a tall model tower out of wooden blocks.", options: ["a) colorful", "b) carefully", "c) build", "d) happy"], correct: 2, exp: "Action of constructing is 'build'." },
                    { q: "The playful puppy _____ across the green lawn to catch the bright yellow ball.", options: ["a) garden", "b) fluffy", "c) fast", "d) ran"], correct: 3, exp: "Action across the lawn is 'ran'." },
                    { q: "Please _____ your name neatly at the top of the reading paper.", options: ["a) clear", "b) write", "c) pencil", "d) paper"], correct: 1, exp: "Action on paper is 'write'." },
                    { q: "Every afternoon, the hungry birds _____ seeds from the feeder hanging in the tree.", options: ["a) small", "b) loud", "c) eat", "d) morning"], correct: 2, exp: "Action of consuming seeds is 'eat'." },
                    { q: "Maya will _____ her favorite adventure book before she goes to sleep tonight.", options: ["a) read", "b) story", "c) quiet", "d) bookshelf"], correct: 0, exp: "Action with a book is 'read'." },
                    { q: "The cheerful children _____ loudly when their team won the championship game.", options: ["a) victory", "b) quick", "c) excited", "d) shouted"], correct: 3, exp: "Vocal expression of excitement is 'shouted'." },
                    { q: "Dad promised to _____ a giant chocolate cake for my upcoming birthday party.", options: ["a) oven", "b) bake", "c) sweet", "d) tasty"], correct: 1, exp: "Action of making cake is 'bake'." },
                    { q: "The sleek silver airplane will _____ into the cloudy sky at noon.", options: ["a) engine", "b) high", "c) fly", "d) blue"], correct: 2, exp: "Action in the sky is 'fly'." },
                    { q: "You should _____ your hands with warm water and soap before every meal.", options: ["a) healthy", "b) water", "c) clean", "d) wash"], correct: 3, exp: "Action with soap and water is 'wash'." },
                    { q: "The curious detective _____ for missing clues near the garden gate.", options: ["a) looked", "b) dark", "c) puzzle", "d) quiet"], correct: 0, exp: "Action of searching is 'looked'." },
                    { q: "We love to _____ upbeat songs together during music class on Fridays.", options: ["a) loud", "b) sing", "c) melody", "d) instrument"], correct: 1, exp: "Action with songs is 'sing'." },
                    { q: "The agile athlete can _____ over the tall hurdles with ease.", options: ["a) ground", "b) fast", "c) jump", "d) height"], correct: 2, exp: "Action over hurdles is 'jump'." },
                    { q: "The talented artist will _____ a beautiful sunset landscape on the canvas.", options: ["a) paint", "b) bright", "c) picture", "d) brush"], correct: 0, exp: "Action on canvas is 'paint'." }
                ]
            }
        ];

        // --- APP STATE ---
        let currentMode = 'practice';
        let currentCategory = null;
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = parseInt(localStorage.getItem('grammar_streak')) || 0;
        let highScore = parseInt(localStorage.getItem('grammar_highscore')) || 0;
        let userAnswers = [];
        let timerInterval = null;
        let secondsElapsed = 0;
        let soundEnabled = true;

        // --- INITIALIZATION ---
        function initApp() {
            document.getElementById('streakCount').textContent = streak;
            document.getElementById('highScore').textContent = highScore;
            renderCategories();
        }

        function renderCategories() {
            const grid = document.getElementById('categoryGrid');
            grid.innerHTML = '';
            quizDatabase.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => startQuiz(cat);
                card.innerHTML = `
                    <h3>${cat.title}</h3>
                    <p>${cat.description}</p>
                    <span class="q-count">📝 ${cat.questions.length} Questions</span>
                `;
                grid.appendChild(card);
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modePracticeBtn').classList.toggle('active', mode === 'practice');
            document.getElementById('modeExamBtn').classList.toggle('active', mode === 'exam');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggleBtn').textContent = soundEnabled ? '🔊' : '🔇';
        }

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.getElementById('themeToggleBtn').textContent = isDark ? '🌙' : '☀️';
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz(category) {
            currentCategory = category;
            currentQuestions = [...category.questions];
            currentIndex = 0;
            score = 0;
            userAnswers = [];
            
            showScreen('quizScreen');
            
            const timerDisplay = document.getElementById('timerDisplay');
            if (currentMode === 'exam') {
                timerDisplay.style.display = 'block';
                secondsElapsed = 0;
                startTimer();
            } else {
                timerDisplay.style.display = 'none';
            }

            loadQuestion();
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerVal').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('questionText').textContent = `${currentIndex + 1}. ${q.q}`;
            
            const progress = (currentIndex / currentQuestions.length) * 100;
            document.getElementById('progressBar').style.width = `${progress}%`;
            document.getElementById('questionCounter').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            document.getElementById('explanationBox').classList.remove('show');
            document.getElementById('nextBtn').disabled = true;

            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((optText, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span> ${optText.replace(/^[a-dA-D]\)\s*/, '')}`;
                btn.onclick = () => selectOption(idx, btn);
                container.appendChild(btn);
            });
        }

        function selectOption(selectedIdx, btnEl) {
            const q = currentQuestions[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.onclick = null); // disable further clicks

            const isCorrect = (selectedIdx === q.correct);
            userAnswers.push({ question: q.q, selected: selectedIdx, correct: q.correct, options: q.options, isCorrect, exp: q.exp });

            if (isCorrect) {
                btnEl.classList.add('correct');
                score++;
                streak++;
                if (streak > highScore) {
                    highScore = streak;
                    localStorage.setItem('grammar_highscore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                localStorage.setItem('grammar_streak', streak);
                document.getElementById('streakCount').textContent = streak;
            } else {
                btnEl.classList.add('incorrect');
                allBtns[q.correct].classList.add('correct');
                streak = 0;
                document.getElementById('streakCount').textContent = streak;
                localStorage.setItem('grammar_streak', streak);
            }

            if (currentMode === 'practice') {
                document.getElementById('explanationText').textContent = q.exp;
                document.getElementById('explanationBox').classList.add('show');
            }

            document.getElementById('nextBtn').disabled = false;
        }

        function handleNextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            if (timerInterval) clearInterval(timerInterval);
            showScreen('resultsScreen');

            const percentage = Math.round((score / currentQuestions.length) * 100);
            document.getElementById('scorePercent').textContent = `${percentage}%`;
            document.getElementById('scoreFraction').textContent = `${score} / ${currentQuestions.length}`;
            document.getElementById('progressBar').style.width = `100%`;

            if (percentage >= 80) {
                document.getElementById('resultTitle').textContent = "Outstanding! 🎉";
                document.getElementById('resultMessage').textContent = "You're a master of this topic!";
            } else if (percentage >= 50) {
                document.getElementById('resultTitle').textContent = "Good Effort! 👍";
                document.getElementById('resultMessage').textContent = "Keep practicing to get an even higher score!";
            } else {
                document.getElementById('resultTitle').textContent = "Keep Learning! 💪";
                document.getElementById('resultMessage').textContent = "Review the explanations and try again!";
            }

            const reviewList = document.getElementById('reviewList');
            reviewList.innerHTML = '';
            userAnswers.forEach((ans, idx) => {
                const item = document.createElement('div');
                item.className = `review-item ${ans.isCorrect ? 'correct' : 'incorrect'}`;
                item.innerHTML = `
                    <strong>Q${idx+1}: ${ans.question}</strong><br>
                    Your answer: ${ans.options[ans.selected]} ${ans.isCorrect ? '✅' : '❌'}<br>
                    ${!ans.isCorrect ? `Correct answer: ${ans.options[ans.correct]}<br>` : ''}
                    <em>💡 ${ans.exp}</em>
                `;
                reviewList.appendChild(item);
            });
        }

        function retryQuiz() {
            startQuiz(currentCategory);
        }

        function goToHome() {
            if (timerInterval) clearInterval(timerInterval);
            showScreen('homeScreen');
        }

        function quitQuiz() {
            if (confirm("Are you sure you want to quit this quiz?")) {
                goToHome();
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
