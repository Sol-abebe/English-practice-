  <script>
    // --- AUDIO SYNTHESIZER (Web Audio API) ---
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playCorrect() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.35); // C6
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.5);
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now); // A3
        osc.frequency.linearRampToValueAtTime(130, now + 0.3); // C3
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      }
    }

    // --- APPLICATION STATE ENGINE ---
    class GrammarApp {
      constructor() {
        this.currentCat = null;
        this.mode = 'practice'; // 'practice' or 'exam'
        this.currentIndex = 0;
        this.score = 0;
        this.streak = 0;
        this.userAnswers = [];
        this.timer = null;
        this.timeLeft = 0;
        this.totalExamTime = 0;
      }

      toggleSound() {
        soundFX.enabled = !soundFX.enabled;
        const icon = document.getElementById('soundIcon');
        const btn = document.getElementById('soundToggleBtn');
        if (soundFX.enabled) {
          icon.className = 'fa-solid fa-volume-high';
          btn.classList.add('text-amber-300');
          btn.classList.remove('text-slate-400');
          soundFX.playClick();
        } else {
          icon.className = 'fa-solid fa-volume-xmark';
          btn.classList.remove('text-amber-300');
          btn.classList.add('text-slate-400');
        }
      }

      goHome() {
        soundFX.playClick();
        if (this.timer) clearInterval(this.timer);
        this.renderCategorySelection();
      }

      renderCategorySelection() {
        const container = document.getElementById('appContainer');
        container.innerHTML = `
          <div class="text-center mb-8">
            <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-2">Choose Your Grammar Challenge!</h2>
            <p class="text-purple-200 text-sm md:text-base">Select a worksheet topic and play in Practice or Exam mode.</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${quizCategories.map((cat, index) => `
              <div class="glass-card-3d rounded-2xl p-5 flex flex-col justify-between cat-card border-t-2 border-white/20">
                <div>
                  <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-r ${cat.color} flex items-center justify-center text-white text-xl shadow-md">
                      <i class="fa-solid ${cat.icon}"></i>
                    </div>
                    <div>
                      <h3 class="font-bold text-lg text-white leading-tight">${cat.title}</h3>
                      <span class="text-xs text-purple-300 font-medium">${cat.subtitle} • ${cat.questions.length} Questions</span>
                    </div>
                  </div>
                </div>

                <div class="flex gap-2 mt-4 pt-3 border-t border-white/10">
                  <button onclick="app.startQuiz('${cat.id}', 'practice')" class="flex-1 py-2.5 px-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold text-xs shadow-md transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-graduation-cap"></i> Practice
                  </button>
                  <button onclick="app.startQuiz('${cat.id}', 'exam')" class="flex-1 py-2.5 px-3 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold text-xs shadow-md transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-stopwatch"></i> Exam Mode
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      startQuiz(catId, mode) {
        soundFX.playClick();
        this.currentCat = quizCategories.find(c => c.id === catId);
        this.mode = mode;
        this.currentIndex = 0;
        this.score = 0;
        this.userAnswers = new Array(this.currentCat.questions.length).fill(null);

        if (this.mode === 'exam') {
          // 20 seconds per question for exam mode
          this.timeLeft = this.currentCat.questions.length * 20;
          this.totalExamTime = this.timeLeft;
          this.startTimer();
        }

        this.renderQuestion();
      }

      startTimer() {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
          this.timeLeft--;
          const timerEl = document.getElementById('timerDisplay');
          if (timerEl) {
            const mins = Math.floor(this.timeLeft / 60);
            const secs = this.timeLeft % 60;
            timerEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (this.timeLeft <= 10) {
              timerEl.classList.add('timer-warning');
            }
          }
          if (this.timeLeft <= 0) {
            clearInterval(this.timer);
            this.finishQuiz();
          }
        }, 1000);
      }

      renderQuestion() {
        const qData = this.currentCat.questions[this.currentIndex];
        const total = this.currentCat.questions.length;
        const progressPct = ((this.currentIndex + 1) / total) * 100;
        const isExam = this.mode === 'exam';

        const container = document.getElementById('appContainer');
        container.innerHTML = `
          <div class="glass-card-3d rounded-3xl p-6 md:p-8 max-w-3xl mx-auto w-full relative">
            
            <!-- Top Quiz Header Status -->
            <div class="flex flex-wrap justify-between items-center gap-3 mb-6 pb-4 border-b border-white/10">
              <div class="flex items-center gap-2">
                <span class="px-3 py-1 rounded-full bg-violet-500/30 border border-violet-400/40 text-violet-200 text-xs font-bold uppercase tracking-wider">
                  ${this.currentCat.title}
                </span>
                <span class="px-3 py-1 rounded-full ${isExam ? 'bg-amber-500/30 border-amber-400/40 text-amber-200' : 'bg-emerald-500/30 border-emerald-400/40 text-emerald-200'} border text-xs font-bold uppercase tracking-wider">
                  ${isExam ? 'Exam Mode' : 'Practice Mode'}
                </span>
              </div>

              ${isExam ? `
                <div class="flex items-center gap-2 font-mono text-lg font-bold text-amber-300 bg-black/30 px-3.5 py-1.5 rounded-xl border border-amber-500/30">
                  <i class="fa-solid fa-clock text-amber-400"></i>
                  <span id="timerDisplay">${Math.floor(this.timeLeft / 60)}:${(this.timeLeft % 60) < 10 ? '0' : ''}${this.timeLeft % 60}</span>
                </div>
              ` : ''}

              <div class="text-sm font-bold text-slate-300">
                Question <span class="text-amber-300 text-base">${this.currentIndex + 1}</span> / ${total}
              </div>
            </div>

            <!-- Animated Progress Bar -->
            <div class="w-full h-2.5 bg-slate-800/80 rounded-full overflow-hidden mb-6 p-0.5 border border-white/10">
              <div class="h-full bg-gradient-to-r from-amber-400 via-fuchsia-500 to-cyan-400 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>

            <!-- Question Card Text -->
            <div class="my-6">
              <h2 class="text-xl md:text-2xl font-bold text-white leading-relaxed tracking-wide">
                ${qData.q}
              </h2>
            </div>

            <!-- Options Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 my-6">
              ${qData.options.map((opt, idx) => {
                let btnStyle = "bg-white/10 hover:bg-violet-600/30 border-white/15 text-white";
                let iconMarkup = "";
                const userAns = this.userAnswers[this.currentIndex];

                if (userAns !== null) {
                  if (idx === qData.answer) {
                    btnStyle = "bg-emerald-600/80 border-emerald-400 text-white font-bold glow-green";
                    iconMarkup = '<i class="fa-solid fa-circle-check text-emerald-200 text-lg"></i>';
                  } else if (userAns === idx) {
                    btnStyle = "bg-rose-600/80 border-rose-400 text-white font-bold";
                    iconMarkup = '<i class="fa-solid fa-circle-xmark text-rose-200 text-lg"></i>';
                  } else {
                    btnStyle = "bg-white/5 border-white/5 text-slate-400 opacity-60";
                  }
                }

                return `
                  <button 
                    onclick="app.selectAnswer(${idx})" 
                    ${userAns !== null ? 'disabled' : ''} 
                    class="option-btn p-4 rounded-2xl border text-left font-semibold text-base md:text-lg flex justify-between items-center ${btnStyle}">
                    <span>${opt}</span>
                    ${iconMarkup}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- Explanation Banner (Practice Mode Immediate Feedback) -->
            ${(!isExam && this.userAnswers[this.currentIndex] !== null) ? `
              <div class="mt-6 p-4 rounded-2xl bg-gradient-to-r ${this.userAnswers[this.currentIndex] === qData.answer ? 'from-emerald-950/80 to-teal-900/80 border-emerald-500/50' : 'from-rose-950/80 to-pink-900/80 border-rose-500/50'} border text-purple-100 animate-fade-in">
                <div class="flex items-center gap-2 mb-1.5 font-bold ${this.userAnswers[this.currentIndex] === qData.answer ? 'text-emerald-300' : 'text-rose-300'}">
                  <i class="fa-solid ${this.userAnswers[this.currentIndex] === qData.answer ? 'fa-circle-check' : 'fa-circle-info'}"></i>
                  <span>${this.userAnswers[this.currentIndex] === qData.answer ? 'Great Job! Correct!' : 'Not Quite! Here is why:'}</span>
                </div>
                <p class="text-sm md:text-base leading-relaxed text-slate-200">${qData.exp}</p>
              </div>
            ` : ''}

            <!-- Bottom Navigation Bar -->
            <div class="flex justify-between items-center mt-8 pt-4 border-t border-white/10">
              <button 
                onclick="app.prevQuestion()" 
                ${this.currentIndex === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-4 py-2 rounded-xl bg-white/5 text-slate-400 text-sm font-bold"' : 'class="px-5 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-sm font-bold transition-all"'}>
                <i class="fa-solid fa-arrow-left mr-2"></i> Previous
              </button>

              ${this.userAnswers[this.currentIndex] !== null || isExam ? `
                <button 
                  onclick="app.nextQuestion()" 
                  class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-300 hover:to-orange-400 text-slate-950 font-extrabold text-sm shadow-lg transition-all flex items-center gap-2">
                  <span>${this.currentIndex === total - 1 ? 'Finish Quiz' : 'Next Question'}</span>
                  <i class="fa-solid ${this.currentIndex === total - 1 ? 'fa-flag-checkered' : 'fa-arrow-right'}"></i>
                </button>
              ` : `
                <span class="text-xs text-purple-300 italic">Select an option to proceed</span>
              `}
            </div>

          </div>
        `;
      }

      selectAnswer(idx) {
        if (this.userAnswers[this.currentIndex] !== null) return;

        this.userAnswers[this.currentIndex] = idx;
        const qData = this.currentCat.questions[this.currentIndex];

        if (idx === qData.answer) {
          this.score++;
          this.streak++;
          soundFX.playCorrect();
        } else {
          this.streak = 0;
          soundFX.playWrong();
        }

        document.getElementById('streakDisplay').textContent = this.streak;
        this.renderQuestion();
      }

      nextQuestion() {
        soundFX.playClick();
        if (this.currentIndex < this.currentCat.questions.length - 1) {
          this.currentIndex++;
          this.renderQuestion();
        } else {
          this.finishQuiz();
        }
      }

      prevQuestion() {
        soundFX.playClick();
        if (this.currentIndex > 0) {
          this.currentIndex--;
          this.renderQuestion();
        }
      }

      finishQuiz() {
        if (this.timer) clearInterval(this.timer);
        const total = this.currentCat.questions.length;
        
        // Calculate final score for Exam mode where questions might have been skipped
        let correctCount = 0;
        this.userAnswers.forEach((ans, index) => {
          if (ans === this.currentCat.questions[index].answer) {
            correctCount++;
          }
        });
        this.score = correctCount;

        const percentage = Math.round((this.score / total) * 100);

        // Confetti trigger on full or high score
        if (percentage >= 80 && typeof confetti === 'function') {
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
          });
        }

        const container = document.getElementById('appContainer');
        container.innerHTML = `
          <div class="glass-card-3d rounded-3xl p-6 md:p-8 max-w-4xl mx-auto w-full my-4">
            
            <!-- Result Summary Header -->
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-gradient-to-tr ${percentage >= 70 ? 'from-emerald-400 to-teal-500 glow-green' : 'from-amber-400 to-orange-500 glow-orange'} text-white text-4xl mb-4 shadow-xl">
                <i class="fa-solid ${percentage >= 70 ? 'fa-trophy' : 'fa-star'}"></i>
              </div>
              <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-2">
                ${percentage === 100 ? 'Awesome! Perfect Score! 🎉' : percentage >= 70 ? 'Great Job! Well Done! 🌟' : 'Good Effort! Keep Practicing! 💪'}
              </h2>
              <p class="text-purple-200 text-sm md:text-base">
                You completed the <span class="font-bold text-amber-300">${this.currentCat.title}</span> quiz in <span class="font-bold uppercase text-amber-300">${this.mode} Mode</span>.
              </p>
            </div>

            <!-- Score Stats Box -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              <div class="p-4 rounded-2xl bg-white/5 border border-white/10 text-center">
                <div class="text-xs uppercase text-purple-300 font-bold tracking-wider mb-1">Score</div>
                <div class="text-3xl font-extrabold text-amber-300">${this.score} / ${total}</div>
              </div>

              <div class="p-4 rounded-2xl bg-white/5 border border-white/10 text-center">
                <div class="text-xs uppercase text-purple-300 font-bold tracking-wider mb-1">Accuracy</div>
                <div class="text-3xl font-extrabold ${percentage >= 70 ? 'text-emerald-400' : 'text-orange-400'}">${percentage}%</div>
              </div>

              <div class="p-4 rounded-2xl bg-white/5 border border-white/10 text-center">
                <div class="text-xs uppercase text-purple-300 font-bold tracking-wider mb-1">Streak Record</div>
                <div class="text-3xl font-extrabold text-fuchsia-400">${this.streak} 🔥</div>
              </div>
            </div>

            <!-- Detailed Answer Review & Explanations Breakdown -->
            <h3 class="text-xl font-bold text-white mb-4 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-amber-400"></i> Review Answers & Explanations
            </h3>

            <div class="space-y-4 max-h-96 overflow-y-auto pr-2 mb-8">
              ${this.currentCat.questions.map((q, idx) => {
                const uAns = this.userAnswers[idx];
                const isCorrect = uAns === q.answer;

                return `
                  <div class="p-4 rounded-2xl ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/30'} border text-left">
                    <div class="flex items-start gap-3">
                      <div class="mt-0.5 text-lg ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                        <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                      </div>
                      <div class="flex-1">
                        <p class="font-bold text-white text-base mb-2">${idx + 1}. ${q.q}</p>
                        
                        <div class="text-xs md:text-sm grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                          <div class="${isCorrect ? 'text-emerald-300' : 'text-rose-300'} font-semibold">
                            Your Choice: ${uAns !== null ? q.options[uAns] : 'Not Answered'}
                          </div>
                          ${!isCorrect ? `
                            <div class="text-emerald-300 font-semibold">
                              Correct Choice: ${q.options[q.answer]}
                            </div>
                          ` : ''}
                        </div>

                        <div class="text-xs text-purple-200/90 bg-black/20 p-2.5 rounded-xl border border-white/5">
                          <span class="font-bold text-amber-300">Explanation:</span> ${q.exp}
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 justify-center">
              <button 
                onclick="app.startQuiz('${this.currentCat.id}', '${this.mode}')" 
                class="px-6 py-3 rounded-2xl bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-extrabold text-sm shadow-lg transition-all flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Retake Quiz
              </button>
              <button 
                onclick="app.goHome()" 
                class="px-6 py-3 rounded-2xl bg-white/10 hover:bg-white/20 text-white font-extrabold text-sm transition-all flex items-center gap-2">
                <i class="fa-solid fa-house"></i> Main Menu
              </button>
            </div>

          </div>
        `;
      }
    }

    // Initialize Web App on Window Load
    let app;
    window.onload = () => {
      app = new GrammarApp();
      app.renderCategorySelection();
    };
  </script>
</body>
</html>
